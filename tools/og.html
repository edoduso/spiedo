<style>
@font-face { font-family: 'Archivo Black'; src: url('../fonts/archivo-black.woff2') format('woff2'); }
@font-face { font-family: 'DM Sans'; src: url('../fonts/dm-sans.woff2') format('woff2'); font-weight: 100 1000; }
:root { --carta:#f4ecd6; --oliva:#3c4320; --lime:#d6f36b; --inchiostro:#1d1b12; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: var(--oliva); color: var(--carta); font-family: 'DM Sans', sans-serif; position: relative; --pf: var(--oliva); }

.luogo { position: absolute; left: 86px; bottom: 56px; font-size: 28px; letter-spacing: .12em; text-transform: uppercase; color: var(--lime); font-weight: 700; }
svg.ill { position: absolute; right: 61px; bottom: 40px; width: 640px; height: auto; color: var(--carta); overflow: visible; }
.asta { stroke: currentColor; stroke-width: 3; stroke-linecap: round; fill: none; }
.tratto { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.pp { fill: var(--pf, none); }
symbol path, symbol circle, symbol ellipse, symbol rect { stroke-linecap: round; stroke-linejoin: round; }
symbol * { stroke: currentColor; }
